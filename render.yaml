# Render Blueprint — full-stack deployment
# https://docs.render.com/infrastructure-as-code

databases:
  - name: mavisdraw-db
    plan: basic-256mb
    databaseName: mavisdraw
    user: mavisdraw

services:
  # ── Backend API + WebSocket server ──────────────────────
  - type: web
    name: mavisdraw-api
    runtime: node
    plan: standard
    buildCommand: pnpm install && pnpm turbo run build --filter=@mavisdraw/server
    # Schema changes are versioned migrations (apps/server/drizzle), applied
    # before the new version takes traffic; a failure stops the deploy
    preDeployCommand: node apps/server/dist/db/migrate.js
    startCommand: node apps/server/dist/index.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: mavisdraw-db
          property: connectionString
      - key: CORS_ORIGIN
        fromService:
          name: mavisdraw-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: COOKIE_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Requests reach the app through Render's proxy: use the address it
      # appends to X-Forwarded-For (rate limits are per client, not per proxy).
      # A hop count, not "true": "true" would believe whatever the client sends.
      - key: TRUST_PROXY
        value: "1"
      # Set these in the dashboard to enable GitHub (see docs/github-oauth-setup.md):
      # GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, GITHUB_REDIRECT_URI,
      # GITHUB_TOKEN_ENCRYPTION_KEY (64 hex chars: openssl rand -hex 32)
      # and optionally GITHUB_ENTERPRISE_URL + GITHUB_ENTERPRISE_CLIENT_ID/SECRET
      # Pull request checks (optional, see docs/pr-checks.md): GITHUB_APP_ID,
      # GITHUB_APP_SLUG, GITHUB_APP_WEBHOOK_SECRET, GITHUB_APP_PRIVATE_KEY
      # (from https://<this service>/api/github-app/setup)
      # Error reporting (optional): SENTRY_DSN
      # Email (invites, @mentions): MAIL_PROVIDER=resend|postmark, MAIL_FROM,
      # RESEND_API_KEY or POSTMARK_SERVER_TOKEN; APP_URL = the web app's URL
      # (defaults to CORS_ORIGIN). Without a provider, invite links are shown to copy.
    # Readiness (database reachable), so a deploy only takes traffic it can serve
    healthCheckPath: /api/ready

  # ── Frontend static site ────────────────────────────────
  - type: web
    name: mavisdraw-web
    runtime: static
    buildCommand: pnpm install && pnpm turbo run build --filter=@mavisdraw/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        fromService:
          name: mavisdraw-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_WS_URL
        fromService:
          name: mavisdraw-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Error reporting in the browser (optional): VITE_SENTRY_DSN
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
